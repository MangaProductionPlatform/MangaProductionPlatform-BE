version: '3.9'

services:
  # ── API Gateway ──────────────────────────────────────────
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.gateway
    ports:
      - "5010:5000"
    depends_on:
      - identity-service
      - submission-service
      - series-service
      - chapter-service
      - task-service
      - qa-service
      - publishing-service
      - ranking-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients

  # ── Microservices ─────────────────────────────────────────
  identity-service:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.identity
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__IdentityDb=Server=sqlserver;Database=MangaIdentityDB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients
      - Jwt__ExpiryMinutes=60
      - Jwt__RefreshTokenExpiryDays=7
    depends_on:
      - sqlserver

  submission-service:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.submission
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__SubmissionDb=Server=sqlserver;Database=MangaSubmissionDB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
      - RabbitMQ__Host=rabbitmq
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients
    depends_on:
      - sqlserver
      - rabbitmq

  series-service:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.series
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__SeriesDb=Server=sqlserver;Database=MangaSeriesDB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
      - RabbitMQ__Host=rabbitmq
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients
    depends_on:
      - sqlserver
      - rabbitmq

  chapter-service:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.chapter
    ports:
      - "5004:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5004
      - ConnectionStrings__ChapterDb=Server=sqlserver;Database=MangaChapterDB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients
    depends_on:
      - sqlserver

  task-service:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.task
    ports:
      - "5005:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5005
      - ConnectionStrings__TaskDb=Server=sqlserver;Database=MangaTaskDB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
      - RabbitMQ__Host=rabbitmq
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients
    depends_on:
      - sqlserver
      - rabbitmq

  qa-service:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.qa
    ports:
      - "5006:5006"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5006
      - ConnectionStrings__QADb=Server=sqlserver;Database=MangaQADB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients
    depends_on:
      - sqlserver

  publishing-service:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.publishing
    ports:
      - "5007:5007"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5007
      - ConnectionStrings__PublishingDb=Server=sqlserver;Database=MangaPublishingDB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
      - Redis__ConnectionString=redis:6379
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients
    depends_on:
      - sqlserver
      - redis

  ranking-service:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.ranking
    ports:
      - "5008:5008"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5008
      - ConnectionStrings__RankingDb=Server=sqlserver;Database=MangaRankingDB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
      - Jwt__Key=YOUR_SUPER_SECRET_SIGNING_KEY_MINIMUM_32_CHARS
      - Jwt__Issuer=MangaERP.Identity
      - Jwt__Audience=MangaERP.Clients
    depends_on:
      - sqlserver

  # ── Infrastructure Services ──────────────────────────────
  signalr-hub:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.signalr
    ports:
      - "5009:5009"
    depends_on:
      - redis

  background-jobs:
    build:
      context: ..
      dockerfile: docker/Dockerfiles/Dockerfile.backgroundjobs
    environment:
      - ConnectionStrings__HangfireDb=Server=sqlserver;Database=MangaHangfireDB;User Id=sa;Password=MangaERP_Pa$$w0rd!;TrustServerCertificate=true
    depends_on:
      - sqlserver

  # ── Infrastructure Dependencies ──────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MangaERP_Pa$$w0rd!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=mangaerp
      - RABBITMQ_DEFAULT_PASS=mangaerp_secret
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  sqlserver-data:
  rabbitmq-data:
  redis-data:
